services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: langgraph_travel_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d langgraph_travel_agent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  travel-app:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8501:8501"

    restart: unless-stopped


volumes:
  postgres_data: